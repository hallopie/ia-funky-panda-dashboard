  catch(e){return null}}

  e.preventDefault();const pw=$('#pw').value,m=$('#msg'),btn=$('#f button');
  if(!pw){m.textContent='Escribe tu contraseña.';return}
  btn.disabled=true;btn.textContent='Abriendo…';m.textContent='';
  try{
    for(const blob of B){const html=await tryOpen(blob,pw);
      if(html){document.open();document.write(html);document.close();return}}
    m.textContent='Contraseña incorrecta.';
  }catch(err){console.error(err);m.textContent='No se pudo abrir ('+((err&&err.name)||'error')+')'}
  btn.disabled=false;btn.textContent='Entrar';
};
})();
</script>
