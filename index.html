async function tryOpen(blob,pw){
  const buf=b64(blob),salt=buf.slice(0,16),iv=buf.slice(16,28),ct=buf.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  try{const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    return await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
  catch(e){return null}}
$('#f').onsubmit=async e=>{

  btn.disabled=true;btn.textContent='Abriendo…';m.textContent='';
  try{
    for(const blob of B){const html=await tryOpen(blob,pw);
      if(html){document.open();document.write(html);document.close();return}}

};
