form{display:none;margin:-4px 0 14px;gap:8px}form.on{display:flex}

async function tryOpen(blob,pw){
  const buf=b64(blob),salt=buf.slice(0,16),iv=buf.slice(16,28),ct=buf.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);

$('#f').onsubmit=async e=>{
