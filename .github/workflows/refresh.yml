name: refresh-dashboards
on:
  schedule:
    - cron: '30 12 * * *'   # 06:30 CDMX (después del resync de Poster 05:00/05:10)
    - cron: '45 4 * * *'    # 22:45 CDMX (después del corte de las 22:00)
  workflow_dispatch:
    inputs:
      completo:
        description: 'Bajar todo completo de Airtable (1) o solo lo nuevo (0)'
        default: '0'
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cryptography
      - run: python3 build_data.py
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          PW_MARIO: ${{ secrets.PW_MARIO }}
          PW_BRISAS: ${{ secrets.PW_BRISAS }}
          PW_SOCIOS: ${{ secrets.PW_SOCIOS }}
          FULL_REFRESH: ${{ github.event.inputs.completo }}
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add index.html raw.enc; git commit -m "refresh" || true; git push
