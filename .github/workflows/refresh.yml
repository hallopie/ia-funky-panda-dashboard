name: refresh-dashboards
on:
  schedule:
    - cron: '30 12 * * *'   # 06:30 CDMX
    - cron: '45 4 * * *'    # 22:45 CDMX
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cryptography
      - run: python3 build_data.py
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          PW_MARIO: ${{ secrets.PW_MARIO }}
          PW_BRISAS: ${{ secrets.PW_BRISAS }}
          PW_SOCIOS: ${{ secrets.PW_SOCIOS }}
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add index.html; git commit -m "refresh" || true; git push
