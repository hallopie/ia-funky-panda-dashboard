<title>Funky Panda · Acceso</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f6f4ef;--ink:#1d2430;--ink2:#5b6574;--card:#fff;--line:#d9d4c8;--ac:#1f6f78;--err:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12161d;--ink:#eef0f3;--ink2:#a2abb8;--card:#1a2029;--line:#2c3542;--ac:#5fb7c0;--err:#ff8a80;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box}
main{width:100%;max-width:520px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
p.s{margin:0 0 22px;color:var(--ink2)}
.x{display:none}.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;cursor:pointer;color:var(--ink);font:inherit}
.opt:hover,.opt[aria-expanded=true]{border-color:var(--ac)}
.opt b{display:block;font-size:18px}.opt span{color:var(--ink2);font-size:14px}
form{display:none;margin:-4px 0 14px;gap:8px}form.on{display:flex}
input{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
button.go{padding:12px 18px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
#msg{min-height:22px;color:var(--err);font-size:14px;margin:0 0 8px}
footer{margin-top:26px;color:var(--ink2);font-size:13px}
</style>
<main>
<h1>Funky Panda</h1>
<p class="s">Ingresa tu contraseña.</p>
<form id="f" class="on"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" aria-label="Contraseña" autofocus><button class="go">Entrar</button></form>
<div id="msg" role="alert"></div>
<footer>Hecho por Sótano Bajo</footer>
</main>
<script>
(()=>{const B=/*__BLOBS__*/[];const $=s=>document.querySelector(s),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryOpen(blob,pw){
  const buf=b64(blob),salt=buf.slice(0,16),iv=buf.slice(16,28),ct=buf.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  try{const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    return await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
  catch(e){return null}}
$('#f').onsubmit=async e=>{
  e.preventDefault();const pw=$('#pw').value,m=$('#msg'),btn=$('#f button');
  if(!pw){m.textContent='Escribe tu contraseña.';return}
  btn.disabled=true;btn.textContent='Abriendo…';m.textContent='';
  try{
    for(const blob of B){const html=await tryOpen(blob,pw);
      if(html){document.open();document.write(html);document.close();return}}
    m.textContent='Contraseña incorrecta.';
  }catch(err){console.error(err);m.textContent='No se pudo abrir ('+((err&&err.name)||'error')+')'}
  btn.disabled=false;btn.textContent='Entrar';
};
})();
</script>
