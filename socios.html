    if(!hasB)h+=`<div class="card"><p class="note">El cierre semanal de San Miguel se arma cuando Mario entregue su control de esa sucursal.</p></div>`;
    else{
      const wsAll=[...new Set(DATA.daily.filter(x=>x.b==='B').map(x=>wk(x.d)))].sort().filter(w=>DATA.daily.filter(x=>x.b==='B'&&x.d>=w&&x.d<=addD(w,6)).length===7);
      const wsL=wsAll.slice(-8).reverse();
      if(!st.cw||!wsL.includes(st.cw))st.cw=wsL[0];
      const w=st.cw,e=addD(w,6),R=DATA.daily.filter(x=>x.b==='B'&&x.d>=w&&x.d<=e),ct=(DATA.control.B||{})[w];
      const gw=DATA.gastos.filter(x=>x.b==='B'&&x.d>=w&&x.d<=e),gb=k=>gw.filter(x=>x.bk===k).reduce((s,x)=>s+x.t,0);
      const ventas=sum(R,'ing'),tj=sum(R,'tj')+sum(R,'ub')+sum(R,'rp')+sum(R,'mp')+sum(R,'pw')+sum(R,'cl'),ef=sum(R,'ef'),prop=sum(R,'prop'),com=0.04*tj,nom=DATA.nomina.B;
      const haveG=gw.length>0,ins=gb('Insumos')+gb('Operativos');
      const sel_=`<div class="seg" style="margin-bottom:10px" role="group" aria-label="Semana">${wsL.map(x=>`<button data-cw="${x}" aria-pressed="${x===w}">${lbl(x)}–${lbl(addD(x,6))}</button>`).join('')}</div>`;
      const fx=(a,b)=>b==null||a==null?'':(Math.abs(a-b)<1.5?'<span class="pos">✓ cuadra</span>':`<span class="neg">${peso(a-b)}</span>`);
      const row=(n,dv,cv,src)=>[n,dv==null?'<span class="pend">—</span>':peso(dv),cv==null?'<span class="pend">—</span>':peso(cv),ct?fx(dv,cv):'',src];
      const insD=haveG?ins:null;
      const resD=haveG?ventas-nom-com-prop-ins:null;
      const rows=[
        row('Ventas (Poster, sin propina)',ventas,ct&&ct.ventas,'Poster → Make → Airtable'),
        row('Tarjeta (banco, MP, Paywise, Clip, Uber, Rappi)',tj,ct&&ct.tj,'Poster · método de pago'),
        row('Efectivo',ef,ct&&ct.cash,'Poster · método de pago'),
        row('Comisión bancaria (4% de tarjeta)',com,ct&&ct.comision,'Modelo de Mario'),
        row('Propinas',prop,ct&&ct.propinas,'Poster'),
        row('Nómina (base semanal)',nom,ct&&ct.nomina,'Tabla de nómina de Mario'),
        row('Insumos + caja chica + gas + gasolina',insD,ct&&ct.insumos,haveG?'Airtable · gastos':'Airtable aún sin captura de esta semana'),
        row('Apartado de renta',null,ct&&ct.apartado_renta,'Mario (transferencia a cuenta de renta)'),
        row('<b>Resultado semanal</b>',resD,ct&&ct.resultado,'Ventas − nómina − comisión − propinas − insumos − apartado')];
      h+=`<div class="card">${sel_}<p class="note">Misma estructura que el control semanal de Mario, Brisas ${lbl(w)}–${lbl(e)}. ${ct?'Esta semana ya tiene el control de Mario: la columna «Dif.» marca dónde cuadra y dónde no.':'Esta semana todavía no está en el control de Mario; se muestra lo calculado por el sistema.'}</p>`+
        table(['Concepto','Sistema','Control Mario','Dif.','De dónde sale'],rows)+
        (ct?`<p class="note" style="margin-top:8px">Mario: inicio de semana ${peso(ct.inicio)} · ventas ${peso(ct.ventas)} = total semanal ${peso(ct.inicio+ct.ventas)} · total pagos ${peso(ct.total_pagos)} · <b>disponible ${peso(ct.disponible)}</b>. Su «Insumos» ya incluye caja chica (${peso(ct.caja_chica)}), gas y gasolina (${peso(ct.gas+ct.gasolina)}). Propinas: él descuenta ${peso(ct.propinas)}, Poster reporta ${peso(prop)} (posible neto de comisión; por confirmar).</p>`:'')+`</div>`}
  }

  /* P&L */
  h+=`<h2>Estado de resultados (P&amp;L)</h2><div class="card"><div class="note">Periodo: ${P.dias} días con venta. Nómina, fijos, comisiones (4% de pagos con tarjeta) e impuestos (10% de ventas declaradas: 20% del efectivo + Mercado Pago) estimados con el modelo de Mario; insumos y operativos a real. Excluye obra, préstamos y movimientos sin clasificar.</div>`;
  const ub_=P.ing-P.ins;
  const pl=[['Ventas',P.ing,1],['(−) Insumos',-P.ins],['Utilidad bruta',ub_,1,1],['(−) Nómina (plan)',-P.nom],['(−) Costos fijos (plan)',-P.fijos],['(−) Comisiones',-P.com],['(−) Gastos operativos',-P.op],['(−) Impuestos (est.)',-P.imp],['Utilidad operativa',util,1,1]];
  h+=table(['Concepto','Monto','% venta'],pl.map(r=>[r[3]?`<b>${r[0]}</b>`:r[0],r[1]==null?'<span class="pend">pendiente</span>':(r[3]?`<b class="${r[1]>=0?'pos':'neg'}">${peso(r[1])}</b>`:peso(r[1])),r[1]==null?'':(r[3]?pct(r[1],P.ing):pct(Math.abs(r[1]),P.ing))]));
  h+=`<p class="note" style="margin-top:8px">Memo (fuera del P&amp;L): obra ${peso(P.inv)} · préstamos ${peso(P.pre)} · sin clasificar ${peso(P.sc)}.</p></div>`;

  /* ACTUALIZACION */
  const gen=new Date(M.generado);
  h+=`<h2>Actualización y cortes</h2><div class="card"><table><tbody><tr><td>Último corte de ventas</td><td><b>${lbl(last)} ${last.slice(0,4)}</b></td></tr><tr><td>Datos generados</td><td>${gen.toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'})}</td></tr><tr><td>Siguiente actualización</td><td>Diaria, ~22:30 (cierre de Poster)</td></tr><tr><td>Día en curso</td><td>No incluido hasta el cierre${FULL?' (usa «Venta en vivo»)':''}</td></tr></tbody></table></div>`;
  $('#main').innerHTML=h;
  $('#cut').innerHTML=`Último corte: <b>${lbl(last)}</b>`;
  bind();
}
function liveCard(){
  let c=null;try{c=JSON.parse(localStorage.getItem('fp_live')||'null')}catch(e){}
  const fresh=c&&Date.now()-c.t<30*60e3;
  return `<div class="card" style="margin-top:12px"><div class="live"><div><h3>Venta en vivo</h3><p class="note" style="margin:0">Hoy hasta ahora. Se actualiza máx. cada 30 min.</p></div>
   <div id="liveOut">${c?`<b style="font-size:20px">${peso(c.v)}</b> · ${num(c.k)} tickets <span class="note">(${new Date(c.t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})})</span>`:(LIVE_URL?'':'<span class="pend">Se activa al conectar el webhook</span>')}</div>
   <button id="liveBtn" ${(!LIVE_URL||fresh)?'disabled':''}>${fresh?'Actualizado hace poco':'Actualizar'}</button></div></div>`}
async function live(){
  const b=$('#liveBtn');b.disabled=true;b.textContent='Consultando…';
  try{const r=await(await fetch(LIVE_URL)).json();const o={t:Date.now(),v:r.ventas??r.v,k:r.tickets??r.k};localStorage.setItem('fp_live',JSON.stringify(o))}catch(e){}
  render()}
function bind(){
  document.querySelectorAll('[data-cw]').forEach(b=>b.onclick=()=>{st.cw=b.dataset.cw;render()});
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{st.gran=b.dataset.g;render()});
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{st.tbl[b.dataset.t]=!st.tbl[b.dataset.t];render()});
  const lb=$('#liveBtn');if(lb&&LIVE_URL)lb.onclick=live;
}
function bar(){
  const per=[['all','Todo'],...months.map(m=>[m,MESL[+m.slice(5)-1]]),['30d','30 días'],['7d','7 días']];
  let h='';
  if(DATA.branches.length>1)h+=`<div class="seg" role="group" aria-label="Sucursal">${[['ALL','Ambas'],['B','Brisas'],['S','San Miguel']].map(a=>`<button data-br="${a[0]}" aria-pressed="${st.br===a[0]}">${a[1]}</button>`).join('')}</div>`;
  h+=`<div class="seg" role="group" aria-label="Periodo">${per.map(a=>`<button data-p="${a[0]}" aria-pressed="${st.per===a[0]}">${a[1]}</button>`).join('')}</div>`;
  $('#bar').innerHTML=h;
  $('#bar').querySelectorAll('[data-br]').forEach(b=>b.onclick=()=>{st.br=b.dataset.br;bar();render()});
  $('#bar').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{st.per=b.dataset.p;bar();render()});
}
$('#ttl').textContent=DATA.title;$('#sub').textContent=DATA.sub;
$('#foot').innerHTML='Funky Panda · datos de Poster vía Make → Airtable · <span class="pend">Hecho por Somos Enlace IA</span>';
bar();render();
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,150)});
</script>
</body>
</html>
