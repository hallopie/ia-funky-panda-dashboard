<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>__TITLE__</title>
<style>
:root{
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#6f6d67; --grid:#e1e0d9; --axis:#c3c2b7;
  --good:#006300; --bad:#b42323; --warn-bg:#fff4d6; --warn-ink:#6b4b00; --accent:#2a78d6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s9:#8a6d3b;
  --seq:#2a78d6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#a09f97; --grid:#2c2c2a; --axis:#383835;
  --good:#3ecf5a; --bad:#ff7a7a; --warn-bg:#3a2f0d; --warn-ink:#f3d58a; --accent:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#b8955a; --seq:#3987e5; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#a09f97; --grid:#2c2c2a; --axis:#383835;
  --good:#3ecf5a; --bad:#ff7a7a; --warn-bg:#3a2f0d; --warn-ink:#f3d58a; --accent:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#b8955a; --seq:#3987e5; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1120px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-block:20px 12px}
h1{font:700 22px/1.2 system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink2);margin-top:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--page);display:flex;flex-wrap:wrap;gap:8px 16px;padding-block:8px;border-bottom:1px solid var(--grid)}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;border:1px solid var(--axis);border-radius:8px}
.seg button{white-space:nowrap;flex:none;background:transparent;color:var(--ink2);border:0;padding:6px 11px;font:inherit;cursor:pointer;min-height:34px}
.seg button+button{border-left:1px solid var(--axis)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--page);font-weight:600}
h2{font:700 13px/1 system-ui;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:32px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--grid)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:14px;min-width:0}
.card h3{font:600 13px/1.3 system-ui;margin:0 0 2px;color:var(--ink)}
.card .note{color:var(--muted);font-size:12px;margin:0 0 8px}
.kpi .v{font:700 24px/1.15 system-ui;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .l{color:var(--ink2);font-size:12px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.tools{float:right;margin-left:8px}
.tools button{background:transparent;border:1px solid var(--axis);color:var(--ink2);border-radius:6px;font:12px system-ui;padding:3px 8px;cursor:pointer}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--grid);font-size:13px}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink2);font-weight:600;font-size:12px}
tr.tot td{font-weight:700;border-top:1px solid var(--axis)}
.scroll{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin:4px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg{display:block;max-width:100%;overflow:visible}
svg text{fill:var(--muted);font:11px system-ui}
svg .lbl{fill:var(--ink2)}
.hb{display:grid;grid-template-columns:minmax(90px,36%) 1fr auto;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.hb .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .b{height:10px;background:transparent;position:relative}
.hb .b span{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--seq);min-width:2px}
.hb .n{font-variant-numeric:tabular-nums;color:var(--ink2);text-align:right;white-space:nowrap}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 12px;margin:12px 0;font-size:13px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.pend{color:var(--muted);font-style:italic}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--page);padding:6px 9px;border-radius:6px;font-size:12px;line-height:1.35;z-index:50;display:none;max-width:260px}
footer{margin-top:36px;color:var(--muted);font-size:12px}
.live{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.live button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.live button:disabled{opacity:.5}
@media (max-width:520px){h1{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div>
  <div class="sub" id="cut"></div>
</header>
<div class="bar" id="bar"></div>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<div id="tip"></div>
<script>
const DATA=/*__DATA__*/null;
const LIVE_URL='https://hook.us2.make.com/4hsrxy6t04tbz1z2w20dtapqot7orae8'; // webhook Make "poster-live" (cache 30 min)
const M=DATA.meta, FULL=DATA.level==='full';
const $=s=>document.querySelector(s);
const peso=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(Math.round(n||0));
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const num=n=>new Intl.NumberFormat('es-MX',{maximumFractionDigits:0}).format(Math.round(n||0));
const pct=(a,b)=>b?((a/b*100).toFixed(1)+'%'):'—';
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'], MESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(Date.UTC(a,b-1,c))};
const ds=d=>d.toISOString().slice(0,10);
const addD=(s,n)=>{const d=pd(s);d.setUTCDate(d.getUTCDate()+n);return ds(d)};
const wk=s=>{const d=pd(s);const w=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-w);return ds(d)};
const lbl=s=>{const d=pd(s);return d.getUTCDate()+' '+MES[d.getUTCMonth()]};
const BN={B:'Brisas',S:'San Miguel'};
const BC={B:'var(--s1)',S:'var(--s2)'};
const GC={}; M.grupos.forEach((g,i)=>GC[g]='var(--s'+(i+1)+')');
const CATN=M.cat;

const st={br:DATA.branches.length>1?'ALL':DATA.branches[0],per:'all',gran:'d',tbl:{}};
const last=M.ultimoCorte;
const months=[...new Set(DATA.daily.map(x=>x.d.slice(0,7)))].sort();

function inPer(d){
  if(st.per==='all')return true;
  if(st.per==='7d')return d>addD(last,-7);
  if(st.per==='30d')return d>addD(last,-30);
  return d.slice(0,7)===st.per;
}
const sel=a=>a.filter(x=>(st.br==='ALL'||x.b===st.br)&&inPer(x.d));
const sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);

/* ---------- tooltip ---------- */
const tip=$('#tip');
document.addEventListener('pointermove',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t){tip.style.display='none';return}
  tip.innerHTML=t.getAttribute('data-tip').replace(/\n/g,'<br>');tip.style.display='block';
  const w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.min(innerWidth-w-8,Math.max(8,e.clientX+12))+'px';
  tip.style.top=(e.clientY+h+20>innerHeight?e.clientY-h-12:e.clientY+14)+'px';
});
document.addEventListener('pointerleave',()=>tip.style.display='none');

/* ---------- charts ---------- */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
const short=n=>n>=1e6?(n/1e6).toFixed(1).replace('.0','')+' M':n>=1e3?(n/1e3).toFixed(1).replace('.0','')+' k':String(Math.round(n));
function frame(W,H,max,ml=44){
  let g='';for(let i=0;i<=4;i++){const v=max*i/4,y=H.t+(H.h)*(1-i/4);
    g+=`<line x1="${ml}" x2="${W-6}" y1="${y}" y2="${y}" stroke="${i?'var(--grid)':'var(--axis)'}"/><text x="${ml-6}" y="${y+4}" text-anchor="end">${short(v)}</text>`}
  return g}
function legend(items){return `<div class="legend">${items.map(i=>`<span><i style="background:${i[1]}"></i>${i[0]}</span>`).join('')}</div>`}
function barChart(labels,series,o={}){
  const W=o.W||Math.max(280,Math.min(1080,($('#main').clientWidth||600)/(o.cols||1)-30)),Hh=o.h||220;
  const H={t:10,h:Hh-34},ml=44,n=labels.length;
  const tot=labels.map((_,i)=>series.reduce((s,x)=>s+(x.v[i]||0),0));
  const max=niceMax(o.stack?Math.max(...tot):Math.max(...series.flatMap(s=>s.v)));
  const slot=(W-ml-6)/n,bw=Math.max(3,Math.min(26,slot*(o.stack?.62:.7)/(o.stack?1:series.length)));
  let g=frame(W,H,max,ml),every=Math.ceil(n/Math.floor((W-ml)/52));
  labels.forEach((l,i)=>{
    const cx=ml+slot*(i+.5);let acc=0;
    series.forEach((s,k)=>{
      const v=s.v[i]||0,h=v/max*H.h;
      const x=o.stack?cx-bw/2:cx-bw*series.length/2+k*bw, y=o.stack?H.t+H.h-(acc+v)/max*H.h:H.t+H.h-h;
      if(v>0)g+=`<rect x="${x}" y="${y}" width="${Math.max(2,bw-(o.stack?0:1))}" height="${Math.max(1,h)}" rx="${o.stack?0:2}" fill="${s.c}" stroke="${o.stack?'var(--surface)':'none'}" stroke-width="2" data-tip="<b>${l}</b>\n${s.n}: ${o.fmt?o.fmt(v):peso(v)}${o.stack&&series.length>1?'\nTotal: '+(o.fmt?o.fmt(tot[i]):peso(tot[i])):''}"/>`;
      acc+=v});
    g+=`<rect x="${cx-slot/2}" y="${H.t}" width="${slot}" height="${H.h}" fill="transparent" data-tip="<b>${l}</b>\n${series.map(s=>s.n+': '+(o.fmt?o.fmt(s.v[i]||0):peso(s.v[i]||0))).join('\n')}"/>`;
    if(i%every===0)g+=`<text x="${cx}" y="${Hh-12}" text-anchor="middle">${l}</text>`});
  if(o.line){const pts=o.line.v.map((v,i)=>[ml+slot*(i+.5),H.t+H.h-Math.min(v,max)/max*H.h]);
    g+=`<polyline fill="none" stroke="${o.line.c}" stroke-width="2" stroke-dasharray="5 3" points="${pts.map(p=>p.join(',')).join(' ')}"/>`}
  return `<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${o.aria||'gráfica'}">${g}</svg>`}
function lineChart(xs,series,o={}){
  const W=o.W||Math.max(280,Math.min(1080,($('#main').clientWidth||600)/(o.cols||1)-30)),Hh=o.h||240;
  const H={t:12,h:Hh-36},ml=48,mr=70,n=xs.length;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.v.filter(v=>v!=null))));
  const X=i=>ml+(W-ml-mr)*(n>1?i/(n-1):0.5),Y=v=>H.t+H.h-v/max*H.h;
  let g=frame(W,H,max,ml).replace(new RegExp(`x2="${W-6}"`,'g'),`x2="${W-mr+10}"`);
  const every=o.all?1:Math.ceil(n/Math.floor((W-ml-mr)/40));
  xs.forEach((x,i)=>{if(x!==''&&i%every===0)g+=`<text x="${X(i)}" y="${Hh-12}" text-anchor="middle">${x}</text>`});
  series.forEach(s=>{
    const pts=s.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(!pts.length)return;
    g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
    const lp=pts[pts.length-1],lv=s.v.filter(v=>v!=null).pop();
    g+=`<circle cx="${lp[0]}" cy="${lp[1]}" r="4" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/><text class="lbl" x="${lp[0]+8}" y="${lp[1]+4}">${s.n} · ${short(lv)}</text>`;
  });
  xs.forEach((x,i)=>{g+=`<rect x="${X(i)-(W-ml-mr)/n/2}" y="${H.t}" width="${(W-ml-mr)/n}" height="${H.h}" fill="transparent" data-tip="<b>${x}</b>\n${series.map(s=>s.v[i]==null?'':s.n+': '+peso(s.v[i])).filter(Boolean).join('\n')}"/>`});
  return `<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${o.aria||'gráfica'}">${g}</svg>`}
function hbars(rows,fmt=peso,colorFn){
  const mx=Math.max(1,...rows.map(r=>r.v));
  return rows.map(r=>`<div class="hb" data-tip="<b>${esc(r.n)}</b>\n${fmt(r.v)}${r.extra?'\n'+r.extra:''}"><div class="t">${esc(r.n)}</div><div class="b"><span style="width:${r.v/mx*100}%;${colorFn?'background:'+colorFn(r):''}"></span></div><div class="n">${r.right??fmt(r.v)}</div></div>`).join('')||'<p class="note">Sin datos en el periodo.</p>'}
function table(head,rows,foot){
  return `<div class="scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}${foot?`<tr class="tot">${foot.map(c=>`<td>${c}</td>`).join('')}</tr>`:''}</tbody></table></div>`}
function card(id,title,note,chartHTML,tableHTML,leg){
  const t=st.tbl[id];
  return `<div class="card" id="c-${id}"><span class="tools">${tableHTML?`<button data-t="${id}">${t?'Ver gráfica':'Ver tabla'}</button>`:''}</span><h3>${title}</h3><p class="note">${note||''}</p>${t&&tableHTML?tableHTML:(leg||'')+chartHTML}</div>`}

const isoMon=(y,n)=>{const j=new Date(Date.UTC(y,0,4));j.setUTCDate(j.getUTCDate()-((j.getUTCDay()+6)%7)+(n-1)*7);return ds(j)};
function isoWk(s){const d=new Date(s+'T12:00:00Z');const n=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-n+3);const y=d.getUTCFullYear();const j=new Date(Date.UTC(y,0,4));return [y,1+Math.round(((d-j)/864e5-3+((j.getUTCDay()+6)%7))/7)]}
const histMap=()=>{const m={};(DATA.hist||[]).forEach(h=>m[h.b+'|'+h.y+'|'+h.w]=h.i);return m};
/* ---------- agregados ---------- */
function bucketRange(){ // dias de datos del periodo (para prorrateo)
  const d=sel(DATA.daily).map(x=>x.d);return [...new Set(d)].length}
function groupOf(cid){return M.grupo[cid]||'Otros'}
const isBeb=cid=>M.bebidas.includes(cid);
function topN(isB){
  const m={};sel(DATA.prods).filter(p=>isBeb(p.cid)===isB&&p.cid!==6).forEach(p=>{const o=m[p.n]||(m[p.n]={n:p.n,q:0,s:0});o.q+=p.q;o.s+=p.s});
  return Object.values(m).sort((a,b)=>b.q-a.q).slice(0,10)}
function plBlock(pr){
  const S=a=>pr?a.filter(x=>(st.br==='ALL'||x.b===st.br)&&pr(x.d)):sel(a);
  const dias=pr?[...new Set(S(DATA.daily).map(x=>x.d))].length:bucketRange(),brs=st.br==='ALL'?DATA.branches:[st.br];
  const ing=sum(S(DATA.daily),'ing'),g=S(DATA.gastos);
  const by=k=>g.filter(x=>x.bk===k).reduce((s,x)=>s+x.t,0);
  const fijos=brs.reduce((s,b)=>s+Object.values(DATA.fijos[b]).reduce((a,c)=>a+c,0),0)/30*dias;
  const nom=brs.reduce((s,b)=>s+DATA.nomina[b],0)/7*dias;
  return {sinG:g.filter(x=>['Insumos','Operativos'].includes(x.bk)).length===0,dias,ing,ins:by('Insumos'),nomR:by('Nómina'),nom,fijos,serv:by('Servicios'),com:0.04*(sum(S(DATA.daily),'tj')+sum(S(DATA.daily),'mp')+sum(S(DATA.daily),'pw')+sum(S(DATA.daily),'cl')),comR:by('Comisiones'),imp:0.10*(0.2*sum(S(DATA.daily),'ef')+sum(S(DATA.daily),'mp')),op:by('Operativos'),inv:by('Inversión'),pre:by('Préstamos'),sc:by('Sin clasificar'),
    scN:g.filter(x=>x.bk==='Sin clasificar').length}}

/* ---------- render ---------- */
function render(){
  const D=sel(DATA.daily),ing=sum(D,'ing'),rec=sum(D,'rec'),P=plBlock();
  const util=P.ing-P.ins-P.nom-P.fijos-P.com-P.imp-P.op;
  let h='';
  // KPIs
  const kp=[['Ventas',peso(ing),`${P.dias} días con venta`],['Tickets',num(rec),'órdenes cobradas'],['Ticket promedio',peso(rec?ing/rec:0),'ventas ÷ tickets'],['Propinas',peso(sum(D,'prop')),'no incluidas en ventas']];
  if(FULL||true)kp.push(['Margen operativo',pct(util,P.ing),FULL?'ver P&L abajo':'ver P&L abajo']);
  h+=`<div class="kpis" style="margin-top:16px">${kp.map(k=>`<div class="card kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="d">${k[2]}</div></div>`).join('')}</div>`;
  if(FULL)h+=liveCard();

  /* VENTAS */
  h+=`<h2>Ventas</h2><div class="grid">`;
  // tendencia
  const keyf=st.gran==='d'?x=>x:st.gran==='w'?wk:x=>x.slice(0,7)+'-01';
  const keys=[...new Set(D.map(x=>keyf(x.d)))].sort();
  const brs=st.br==='ALL'?DATA.branches:[st.br];
  const series=brs.map(b=>({n:BN[b],c:BC[b],v:keys.map(k=>sum(D.filter(x=>x.b===b&&keyf(x.d)===k),'ing'))}));
  const kl=keys.map(k=>st.gran==='m'?MESL[+k.slice(5,7)-1]:(st.gran==='w'?'Sem '+lbl(k):lbl(k)));
  const tr=`<div class="seg" style="margin-bottom:8px">${[['d','Día'],['w','Semana'],['m','Mes']].map(a=>`<button data-g="${a[0]}" aria-pressed="${st.gran===a[0]}">${a[1]}</button>`).join('')}</div>`;
  const tTab=table(['Periodo',...series.map(s=>s.n),'Total'],keys.map((k,i)=>[kl[i],...series.map(s=>peso(s.v[i])),peso(series.reduce((a,s)=>a+s.v[i],0))]),['Total',...series.map(s=>peso(s.v.reduce((a,c)=>a+c,0))),peso(ing)]);
  h+=`<div style="grid-column:1/-1">`+card('tend','Ventas por '+({d:'día',w:'semana',m:'mes'})[st.gran],'Ingreso Poster (después de descuentos, sin propina)',tr+barChart(kl,series,{stack:true,h:230,aria:'Ventas por periodo'}),tTab,series.length>1?legend(series.map(s=>[s.n,s.c])):'')+`</div>`;
  // acumulado
  const ms=months.filter(m=>sel(DATA.daily).some(x=>x.d.slice(0,7)===m)||st.per==='all'||true);
  const aSeries=ms.map((m,i)=>{let acc=0;const v=[];for(let d=1;d<=31;d++){const ds_=m+'-'+String(d).padStart(2,'0');const rows=DATA.daily.filter(x=>(st.br==='ALL'||x.b===st.br)&&x.d===ds_);
    if(ds_>last||(!rows.length&&d>1&&v[v.length-1]==null)){v.push(null);continue}acc+=sum(rows,'ing');v.push(acc)}
    return{n:MESL[+m.slice(5)-1].slice(0,3),c:'var(--s'+(i+1)+')',v}});
  // truncar nulls por mes que aun no llega
  const aTab=table(['Día',...aSeries.map(s=>s.n)],Array.from({length:31},(_,i)=>[i+1,...aSeries.map(s=>s.v[i]==null?'—':peso(s.v[i]))]));

      return `<div>${s}</div>`+(parts.length?`<div class="note" style="margin:0">${parts.join(' · ')}</div>`:'')};
    const objCell=(n,o,b,tp)=>o==null?'<span class="pend">por definir</span>':cell(n,o,{ing:ob.v},b,null,'',tp);
    const sg=new Set(['(−) Insumos','(−) Gastos operativos']), fl=new Set(['(−) Insumos','(−) Gastos operativos','Utilidad bruta','Utilidad operativa']);
    const rowsPL=defs.map(([n,f,o,b,tp])=>[b?`<b>${n}</b>`:n,...cols.map(c=>c.P.sinG&&sg.has(n)?'<span class="pend">sin captura</span>':cell(n,f(c.P),c.P,b,c.prev&&!(c.prev.sinG&&sg.has(n))?f(c.prev):null,c.prevN,tp)+(c.P.sinG&&b?'*':'')+(c.flag&&fl.has(n)?' †':'')),objCell(n,o,b,tp)]);
    const noObj=ob.v==null?' Las metas de ventas, insumos y utilidad están <b>por definir con Mario</b>; nómina y fijos del objetivo ya salen de su tabla de plan.':'';
    const ult=cols[0];
    h+=`<h2>Estado de resultados (P&amp;L)</h2><div class="card"><div class="note">Los tres últimos meses lado a lado, contra el objetivo mensual. Cada concepto muestra su <b>% sobre las ventas</b> del mes y su <b>cambio contra el mes anterior</b>. Nómina, fijos, comisiones (4% de pagos con tarjeta) e impuestos (10% de ventas declaradas: 20% del efectivo + Mercado Pago) estimados con el modelo de Mario; insumos y operativos a real. Excluye obra, préstamos y movimientos sin clasificar.${noObj}</div>`+
      table(['Concepto',...cols.map(c=>`${c.n}<br><span class="note" style="font-weight:400">${c.sub}</span>`),'Objetivo<br><span class="note" style="font-weight:400">mensual</span>'],rowsPL)+
      `<p class="note" style="margin-top:8px">Memo (${ult.n.toLowerCase()}, fuera del P&amp;L): obra ${peso(ult.P.inv)} · préstamos ${peso(ult.P.pre)} · sin clasificar ${peso(ult.P.sc)}. El mes en curso es parcial (solo los días con venta), así que su cambio en pesos contra el mes anterior no es equivalente: compara mejor el % de ventas.${cols.some(c=>c.P.sinG)?' <b>*</b> Periodo sin gastos capturados todavía (insumos y operativos): la utilidad se ve más alta de lo real hasta que se carguen.':''}${cols.some(c=>c.flag)?' <b>†</b> Los movimientos bancarios están cargados solo hasta el '+lbl(M.bancoHasta)+': insumos y gastos operativos de este mes están incompletos y la utilidad se ve más alta de lo real.':''}</p></div>`;
  }

  /* ACTUALIZACION */

  /* CAJA (cierres de caja + gasto vs meta) */
  if(FULL&&(DATA.cierres||[]).length){
    const CI=DATA.cierres.filter(x=>st.br==='ALL'||x.b===st.br);
    const wsC=[...new Set(CI.map(x=>wk(x.d)))].sort().reverse();
    if(wsC.length){
      if(!st.cx||!wsC.includes(st.cx))st.cx=wsC[0];
      const rows=wsC.slice(0,8).map(w=>{const R=CI.filter(x=>wk(x.d)===w);const ef=sum(R,'ef'),tj=sum(R,'tj'),ub=sum(R,'ub');
        return [lbl(w)+'–'+lbl(addD(w,6)),R.length+'/7',peso(ef),peso(tj),peso(ub),`<b>${peso(ef+tj+ub)}</b>`,peso(sum(R,'inc')),peso(sum(R,'sube')),
          `<span class="${Math.abs(sum(R,'dif'))<1.5?'pos':'neg'}">${peso(sum(R,'dif'))}</span>`,peso(sum(R,'pc')*0.95+sum(R,'ptj')*0.91)]});
      h+=`<h2>Caja · totales semanales</h2><div class="card"><p class="note">Del cierre de caja del turno tarde (misma fórmula de Mario): ventas = efectivo + tarjeta + Uber; sube a fondo = cierre − 2,000; propinas a pagar = efectivo×0.95 + tarjeta×0.91.</p>`+
        `<div style="overflow-x:auto">`+table(['Semana','Cierres','Efectivo','Tarjeta','Uber','Total ventas','Incidencias','Sube a fondo','Diferencia','Propinas a pagar'],rows)+`</div></div>`;
      const w=st.cx,e=addD(w,6),R=CI.filter(x=>x.d>=w&&x.d<=e);
      const selx=`<div class="seg" style="margin-bottom:10px" role="group" aria-label="Semana caja">${wsC.slice(0,8).map(x=>`<button data-cx="${x}" aria-pressed="${x===w}">${lbl(x)}–${lbl(addD(x,6))}</button>`).join('')}</div>`;
      const dr=R.map(x=>[lbl(x.d),peso(x.ab),peso(x.inc),peso(x.ci),peso(x.ef),`<span class="${x.est==='Cuadra'?'pos':'neg'}">${x.dif?peso(x.dif):'✓ cuadra'}</span>`,peso(x.sube),peso(x.pc*0.95+x.ptj*0.91)]);
      h+=`<div class="card" style="margin-top:12px"><h3>Cierre diario</h3>${selx}<div style="overflow-x:auto">`+table(['Día','Abre caja','Incidencias','Cierre caja','Efectivo Poster','Diferencia','Sube a fondo','Propinas a pagar'],dr)+`</div></div>`;
      const GG=DATA.gastos.filter(x=>x.mc&&(st.br==='ALL'||x.b===st.br)&&x.d>=w&&x.d<=e);
      const mrows=DATA.metas.map(([n,m])=>{const v=GG.filter(x=>x.mc===n).reduce((a,x)=>a+x.t,0);
        return [n,peso(m),peso(v),m?`<span class="${v>m?'neg':'pos'}">${v>m?'+':''}${peso(v-m)}</span>`:(v?'<span class="neg">+'+peso(v)+'</span>':'—')]});
      const tm=DATA.metas.reduce((a,x)=>a+x[1],0),tv=GG.reduce((a,x)=>a+x.t,0);
      mrows.push([`<b>Total</b>`,`<b>${peso(tm)}</b>`,`<b>${peso(tv)}</b>`,`<b class="${tv>tm?'neg':'pos'}">${peso(tv-tm)}</b>`]);
      h+=`<div class="card" style="margin-top:12px"><h3>Gasto de caja chica vs. meta semanal</h3><p class="note">Solo gastos pagados en efectivo, semana ${lbl(w)}–${lbl(e)}. Metas semanales de Mario. La asignación de cada gasto a su categoría es propuesta y Mario la confirma.</p>`+table(['Categoría','Meta','Gastado','Diferencia'],mrows)+`</div>`;
    }
  }
  const gen=new Date(M.generado);
  h+=`<h2>Actualización y cortes</h2><div class="card"><table><tbody><tr><td>Último corte de ventas</td><td><b>${lbl(last)} ${last.slice(0,4)}</b></td></tr><tr><td>Datos generados</td><td>${gen.toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'})}</td></tr><tr><td>Siguiente actualización</td><td>Diaria, ~22:30 (cierre de Poster)</td></tr><tr><td>Día en curso</td><td>No incluido hasta el cierre${FULL?' (usa «Venta en vivo»)':''}</td></tr></tbody></table></div>`;
  $('#main').innerHTML=h;
  $('#cut').innerHTML=`Último corte: <b>${lbl(last)}</b>`;
  bind();
}
function liveCard(){
  let c=null;try{c=JSON.parse(localStorage.getItem('fp_live')||'null')}catch(e){}
  const fresh=c&&Date.now()-c.t<30*60e3;
  const hasS=Object.keys(DATA.fijos||{}).includes('S');
  const d=c&&c.lw?(c.v-c.lw)/c.lw*100:null;
  const body=c?`<b style="font-size:20px">${peso(hasS?c.v:c.br)}</b>${hasS?` · ${num(c.k)} recibos <span class="note">(SMA ${peso(c.sm)} · Brisas ${peso(c.br)})</span>`:''}${d!==null&&hasS?` <span class="note">${d>=0?'▲ +':'▼ '}${d.toFixed(0)}% vs mismo día sem. pasada (día completo)</span>`:''} <span class="note">(${new Date(c.t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})})</span>`:'<span class="note">Consultando Poster…</span>';
  return `<div class="card" style="margin-top:12px"><div class="live"><div><h3>Venta en vivo</h3><p class="note" style="margin:0">Hoy hasta ahora, directo de Poster. Se actualiza máx. cada 30 min.</p></div>
   <div id="liveOut">${body}</div>
   <button id="liveBtn" ${fresh?'disabled':''}>${fresh?'Actualizado hace poco':'Actualizar'}</button></div></div>`}
let liveBusy=false;
async function live(){
  if(liveBusy)return;liveBusy=true;
  const b=$('#liveBtn');if(b){b.disabled=true;b.textContent='Consultando…'}
  try{const r=await(await fetch(LIVE_URL)).json();const h=r.hoy||{};
    localStorage.setItem('fp_live',JSON.stringify({t:Date.now(),v:h.total,sm:h.san_miguel,br:h.brisas,k:h.recibos,lw:(r.semana_pasada_mismo_dia||{}).total}))}
  catch(e){const o=$('#liveOut');if(o)o.innerHTML='<span class="note">No se pudo consultar Poster ahora.</span>'}
  liveBusy=false;render()}
setInterval(()=>{if(!FULL||liveBusy||document.hidden)return;let c=null;try{c=JSON.parse(localStorage.getItem('fp_live')||'null')}catch(e){}
  if(!c||Date.now()-c.t>=30*60e3){const y=window.scrollY;live().then(()=>window.scrollTo(0,y))}},60000);
function bind(){
  document.querySelectorAll('[data-cx]').forEach(b=>b.onclick=()=>{st.cx=b.dataset.cx;render()});
  document.querySelectorAll('[data-cw]').forEach(b=>b.onclick=()=>{st.cw=b.dataset.cw;render()});
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{st.gran=b.dataset.g;render()});
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{st.tbl[b.dataset.t]=!st.tbl[b.dataset.t];render()});
  const lb=$('#liveBtn');if(lb){lb.onclick=live;if(!lb.disabled&&!liveBusy&&!window._liveAuto){window._liveAuto=1;live()}}
}
function bar(){
  const per=[['all','Todo'],...months.map(m=>[m,MESL[+m.slice(5)-1]]),['30d','30 días'],['7d','7 días']];
  let h='';
  if(DATA.branches.length>1)h+=`<div class="seg" role="group" aria-label="Sucursal">${[['ALL','Ambas'],['B','Brisas'],['S','San Miguel']].map(a=>`<button data-br="${a[0]}" aria-pressed="${st.br===a[0]}">${a[1]}</button>`).join('')}</div>`;
  h+=`<div class="seg" role="group" aria-label="Periodo">${per.map(a=>`<button data-p="${a[0]}" aria-pressed="${st.per===a[0]}">${a[1]}</button>`).join('')}</div>`;
  $('#bar').innerHTML=h;
  $('#bar').querySelectorAll('[data-br]').forEach(b=>b.onclick=()=>{st.br=b.dataset.br;bar();render()});
  $('#bar').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{st.per=b.dataset.p;bar();render()});
}
$('#ttl').textContent=DATA.title;$('#sub').textContent=DATA.sub;
$('#foot').innerHTML='Funky Panda · datos de Poster vía Make → Airtable · <span class="pend">Hecho por Sótano Bajo</span>';
bar();render();
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,150)});
</script>
